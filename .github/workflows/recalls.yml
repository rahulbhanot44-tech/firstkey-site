name: Update recalls
# Once a day, refresh recalls.json from Health Canada's open data, for the FirstKey app.
on:
  schedule: [{ cron: '17 9 * * *' }]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 scripts/recalls.py
      - run: |
          git config user.name "FirstKey bot"
          git config user.email "support@myfirstkey.ca"
          git add recalls.json
          if ! git diff --cached --quiet; then git commit -m "Update recalls" && git push; fi
